<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>每日资讯早报</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f6f4ef;
        --surface: #ffffff;
        --surface-2: #efece5;
        --ink: #1d1a16;
        --ink-2: #4c463e;
        --muted: #857d6f;
        --line: #e3ded2;
        --accent: #b3352b;
        --accent-soft: #f9e9e7;
        --gold: #a86e12;
        --teal: #14655a;
        --blue: #1d6fb8;
        --violet: #7c4da0;
        --slate: #55606e;
        --good: #2e7d43;
        --warn: #b26a00;
        --bad: #b3352b;
        --shadow: 0 1px 2px rgba(29,26,22,.05), 0 8px 24px -18px rgba(29,26,22,.35);
        --radius: 12px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121316;
          --surface: #1b1d21;
          --surface-2: #23262c;
          --ink: #edeae3;
          --ink-2: #c9c4b9;
          --muted: #97907f;
          --line: #2e3138;
          --accent: #e0685e;
          --accent-soft: #33211f;
          --gold: #d29a3a;
          --teal: #4db3a2;
          --blue: #5ea3dd;
          --violet: #b48fd6;
          --slate: #9aa5b1;
          --good: #63b87c;
          --warn: #d99a3d;
          --bad: #e0685e;
          --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.8);
        }
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 15px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; text-decoration: none; }
      a:hover { color: var(--accent); }
      /* ---------- hero ---------- */
      .hero { position: relative; color: #fff; overflow: hidden; background: #20211f; }
      .hero img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .hero .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,8,.38) 0%, rgba(10,10,8,.18) 40%, rgba(10,10,8,.78) 100%); }
      .hero-inner { position: relative; max-width: 1180px; margin: 0 auto; padding: 30px 20px 34px; display: flex; flex-direction: column; min-height: 430px; }
      .hero-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(6px); color: #fff; font-size: 12.5px; font-weight: 500; padding: 4px 12px; border-radius: 999px; }
      .badge.hot { background: var(--accent); border-color: transparent; }
      .hero h1 { font-family: "Noto Serif SC", serif; font-weight: 900; font-size: clamp(40px, 7vw, 68px); line-height: 1.12; margin: auto 0 0; letter-spacing: .02em; text-shadow: 0 2px 18px rgba(0,0,0,.45); }
      .hero .dateline { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 15px; font-weight: 500; color: rgba(255,255,255,.94); }
      .hero .dateline .big { font-size: 19px; font-weight: 700; }
      .hero .quotes { margin-top: 18px; display: grid; gap: 10px; grid-template-columns: 1fr; }
      @media (min-width: 760px) { .hero .quotes { grid-template-columns: 1fr 1fr; } }
      .quote { background: rgba(12,12,10,.42); border: 1px solid rgba(255,255,255,.22); backdrop-filter: blur(8px); border-radius: 10px; padding: 12px 16px; font-size: 14.5px; line-height: 1.6; }
      .quote .qlabel { font-size: 11.5px; letter-spacing: .14em; color: rgba(255,255,255,.72); margin-bottom: 3px; }
      .hero .credit { margin-top: 12px; font-size: 12px; color: rgba(255,255,255,.66); }

      /* ---------- nav ---------- */
      .toc { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
      .toc-inner { max-width: 1180px; margin: 0 auto; padding: 9px 20px; display: flex; flex-wrap: wrap; gap: 6px; }
      .toc a { font-size: 13.5px; font-weight: 500; color: var(--ink-2); padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
      .toc a:hover { color: var(--accent); border-color: var(--accent); }

      /* ---------- toolbar: fixed search + section jumps (permanent feature, keep on daily data updates) ---------- */
      .toolbar { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
      .toolbar-inner { max-width: 1180px; margin: 0 auto; padding: 10px 20px 9px; }
      .search-row { display: flex; align-items: center; gap: 10px; }
      .search-box { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow); }
      .search-box svg { flex: none; color: var(--muted); }
      .search-box:focus-within { border-color: var(--accent); }
      .search-box input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 14.5px; outline: none; }
      .search-box input::placeholder { color: var(--muted); }
      .search-clear { flex: none; font: inherit; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); cursor: pointer; }
      .search-clear[hidden] { display: none; }
      .search-status { flex: none; font-size: 13px; color: var(--muted); white-space: nowrap; }
      .search-status b { color: var(--accent); font-size: 14.5px; }
      .toolbar .toc-inner { padding: 8px 0 1px; }
      .toolbar .toc-inner a { font-size: 13.5px; font-weight: 500; color: var(--ink-2); padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
      .toolbar .toc-inner a:hover { color: var(--accent); border-color: var(--accent); }
      .search-hidden { display: none !important; }
      .search-empty { max-width: 1180px; margin: 0 auto; padding: 28px 20px 4px; text-align: center; color: var(--muted); font-size: 14.5px; }
      @media (max-width: 640px) {
        .toolbar-inner { padding: 8px 14px; }
        .search-status { font-size: 12.5px; }
        section { scroll-margin-top: 212px; }
      }

      /* ---------- layout ---------- */
      main { max-width: 1180px; margin: 0 auto; padding: 8px 20px 30px; }
      section { margin-top: 38px; scroll-margin-top: 158px; }
      .sec-head { display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 16px; }
      .sec-head .no { font-family: "Noto Serif SC", serif; font-size: 15px; font-weight: 700; color: var(--accent); }
      .sec-head h2 { font-family: "Noto Serif SC", serif; font-size: clamp(21px, 3.4vw, 27px); font-weight: 900; margin: 0; letter-spacing: .02em; }
      .sec-head .sub { margin-left: auto; font-size: 12.5px; color: var(--muted); text-align: right; }
      .grid { display: grid; gap: 14px; }
      .cols-2 { grid-template-columns: 1fr; }
      .cols-3 { grid-template-columns: 1fr; }
      @media (min-width: 760px) { .cols-2 { grid-template-columns: 1fr 1fr; } .cols-3 { grid-template-columns: 1fr 1fr; } }
      @media (min-width: 1020px) { .cols-3 { grid-template-columns: repeat(3, 1fr); } }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
      .card h3 { margin: 0 0 10px; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
      .card h3 .tag { margin-left: auto; font-size: 11.5px; font-weight: 500; color: var(--muted); }
      .card h3::before { content: ""; width: 4px; height: 15px; border-radius: 2px; background: var(--accent); flex: none; }
      .empty-note { color: var(--muted); font-size: 14px; padding: 18px 0 8px; text-align: center; }
      /* ranked lists */
      .rank-list { list-style: none; margin: 0; padding: 0; }
      .rank-list li { display: flex; gap: 10px; align-items: baseline; padding: 6.5px 0; border-bottom: 1px dashed var(--line); }
      .rank-list li:last-child { border-bottom: none; }
      .rk { flex: none; width: 21px; text-align: center; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 14px; color: var(--muted); }
      .rk.top { color: var(--accent); }
      .rank-list .t { font-weight: 700; font-size: 14.5px; line-height: 1.5; min-width: 0; }
      .rank-list .hot { margin-left: auto; flex: none; font-size: 12px; color: var(--gold); font-weight: 500; white-space: nowrap; }
      .rank-list .sum { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); margin-top: 1px; }
      .scroll-card { display: flex; flex-direction: column; height: 372px; }
      .scroll-card .scroll-body { overflow-y: auto; padding-right: 4px; scrollbar-width: thin; }
      .scroll-card.tall { height: 430px; }

      /* 60s news */
      .news60 { counter-reset: n60; columns: 1; column-gap: 34px; }
      @media (min-width: 860px) { .news60 { columns: 2; } }
      .news60 p { margin: 0; padding: 9px 0 9px 34px; position: relative; border-bottom: 1px dashed var(--line); break-inside: avoid; font-size: 15px; line-height: 1.62; }
      .news60 p::before { counter-increment: n60; content: counter(n60, decimal-leading-zero); position: absolute; left: 0; top: 10px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 13.5px; color: var(--accent); }

      /* article lists */
      .art { padding: 9px 0; border-bottom: 1px dashed var(--line); }
      .art:last-child { border-bottom: none; }
      .art .at { font-weight: 700; font-size: 15px; line-height: 1.5; }
      .art .ad { font-size: 13px; color: var(--ink-2); margin-top: 3px; line-height: 1.6; }
      .art .am { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
      .plain-list { list-style: none; margin: 0; padding: 0; }
      .plain-list li { padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14.5px; }
      .plain-list li:last-child { border-bottom: none; }

      /* tabs */
      .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
      .tabs button { font: inherit; font-size: 13px; font-weight: 600; padding: 5px 13px; border-radius: 999px; cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); }
      .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
      .hn-en { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 1px; }
      .score-chip { flex: none; margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }

      /* epic */
      .epic-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
      @media (min-width: 760px) { .epic-grid { grid-template-columns: repeat(3, 1fr); } }
      .epic-card { overflow: hidden; padding: 0; display: flex; flex-direction: column; }
      .epic-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--surface-2); }
      .epic-body { padding: 13px 16px 15px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
      .epic-body .et { font-weight: 700; font-size: 15.5px; }
      .epic-body .ed { font-size: 13px; color: var(--ink-2); line-height: 1.6; flex: 1; }
      .epic-meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
      .pill { padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-weight: 500; }
      .pill.free { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
      /* finance */
      .big-price { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
      .big-price .num { font-family: "Noto Serif SC", serif; font-size: 40px; font-weight: 900; color: var(--gold); line-height: 1.1; }
      .big-price .unit { color: var(--muted); font-size: 13.5px; }
      table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
      th, td { padding: 6.5px 6px; text-align: right; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
      td:first-child, th:first-child { text-align: left; }
      @media (max-width: 480px) { th, td { padding: 6px 3px; font-size: 12.5px; } }
      tr:last-child td { border-bottom: none; }
      .fx-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
      @media (min-width: 760px) { .fx-grid { grid-template-columns: repeat(3, 1fr); } }
      @media (min-width: 1020px) { .fx-grid { grid-template-columns: repeat(5, 1fr); } }
      .fx-tile { background: var(--surface-2); border-radius: 10px; padding: 11px 13px; }
      .fx-tile .fc { font-size: 12.5px; color: var(--muted); font-weight: 500; }
      .fx-tile .fv { font-family: "Noto Serif SC", serif; font-size: 21px; font-weight: 700; margin-top: 1px; font-variant-numeric: tabular-nums; }
      .fx-tile .fs { font-size: 12px; color: var(--muted); }
      .fuel-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
      @media (min-width: 760px) { .fuel-grid { grid-template-columns: repeat(4, 1fr); } }
      .fuel-tile { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; text-align: center; }
      .fuel-tile .fn { font-size: 13px; color: var(--muted); }
      .fuel-tile .fp { font-family: "Noto Serif SC", serif; font-size: 25px; font-weight: 900; color: var(--accent); }
      .fuel-tile .fu { font-size: 12px; color: var(--muted); }

      /* weather */
      .wx-now { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
      .wx-temp { font-family: "Noto Serif SC", serif; font-size: 58px; font-weight: 900; line-height: 1; }
      .wx-cond { font-size: 19px; font-weight: 700; }
      .wx-meta { font-size: 13px; color: var(--ink-2); line-height: 1.7; }
      .aqi-badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #fff; background: var(--warn); }
      .life-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-top: 12px; }
      @media (min-width: 760px) { .life-grid { grid-template-columns: repeat(4, 1fr); } }
      .life-item .ln { font-size: 12.5px; color: var(--muted); }
      .life-item .ll { font-weight: 700; font-size: 14.5px; }
      .life-item .ld { font-size: 12px; color: var(--ink-2); line-height: 1.55; }
      .fc-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
      .fc-row:last-child { border-bottom: none; }
      .fc-row .fd { width: 88px; flex: none; font-weight: 600; }
      .fc-row .fw { flex: 1; min-width: 0; }
      .fc-row .ft { margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .fc-row .ft b { color: var(--accent); }
      .fc-row .fa { font-size: 12px; color: var(--muted); width: 62px; flex: none; text-align: right; }
      .kv { display: flex; gap: 8px; padding: 5.5px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
      .kv:last-child { border-bottom: none; }
      .kv .k { flex: none; width: 64px; color: var(--muted); font-size: 13px; }
      .yi { color: var(--good); font-weight: 600; }
      .ji { color: var(--bad); font-weight: 600; }
      .hist-item { padding: 7px 0; border-bottom: 1px dashed var(--line); }
      .hist-item:last-child { border-bottom: none; }
      .hist-item .hy { font-family: "Noto Serif SC", serif; font-weight: 700; color: var(--accent); margin-right: 8px; }
      .hist-item .ht { font-weight: 700; font-size: 14.5px; }
      .hist-item .hd { font-size: 12.5px; color: var(--muted); line-height: 1.55; }
      .prog { margin-top: 10px; }
      .prog .pl { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-2); }
      .prog .bar { height: 7px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin-top: 3px; }
      .prog .bar i { display: block; height: 100%; background: var(--teal); border-radius: 4px; }
      .cd-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
      .cd-tile { flex: 1; min-width: 92px; background: var(--surface-2); border-radius: 10px; padding: 10px 8px; text-align: center; }
      .cd-tile .cn { font-family: "Noto Serif SC", serif; font-size: 24px; font-weight: 900; color: var(--teal); }
      .cd-tile .cl { font-size: 12px; color: var(--muted); }

      /* analysis */
      .ana-summary { background: var(--accent-soft); border-radius: var(--radius); padding: 16px 18px; font-size: 15.5px; line-height: 1.75; margin-bottom: 14px; }
      .dim-top { display: flex; align-items: center; gap: 12px; }
      .dim-name { font-family: "Noto Serif SC", serif; font-size: 18px; font-weight: 900; }
      .dim-score { margin-left: auto; font-family: "Noto Serif SC", serif; font-size: 30px; font-weight: 900; line-height: 1; }
      .dim-score small { font-size: 12px; color: var(--muted); font-weight: 400; }
      .dim-bar { height: 8px; border-radius: 4px; background: var(--surface-2); margin: 10px 0; overflow: hidden; }
      .dim-bar i { display: block; height: 100%; border-radius: 4px; }
      .dim-head { font-weight: 700; font-size: 15px; }
      .dim-detail { font-size: 13.5px; color: var(--ink-2); line-height: 1.7; margin-top: 4px; }

      /* charts */
      .chart-wrap svg { width: 100%; height: auto; display: block; }
      .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
      .legend .li { display: inline-flex; align-items: center; gap: 6px; }
      .legend .sw { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
      .mini-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
      @media (min-width: 760px) { .mini-grid { grid-template-columns: 1fr 1fr; } }
      @media (min-width: 1020px) { .mini-grid { grid-template-columns: repeat(3, 1fr); } }
      .mini-card .mv { font-family: "Noto Serif SC", serif; font-size: 23px; font-weight: 900; }
      .mini-card .md { font-size: 12px; color: var(--muted); }
      .delta { font-size: 12.5px; font-weight: 700; }
      .delta.up { color: var(--bad); }
      .delta.down { color: var(--good); }
      .delta.flat { color: var(--muted); }

      /* douban */
      .poster-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
      @media (min-width: 620px) { .poster-grid { grid-template-columns: repeat(3, 1fr); } }
      @media (min-width: 1020px) { .poster-grid { grid-template-columns: repeat(5, 1fr); } }
      .poster { min-width: 0; }
      .poster img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; display: block; background: var(--surface-2); }
      .poster .pt { font-weight: 700; font-size: 14px; margin-top: 6px; line-height: 1.4; }
      .poster .pr { font-size: 12.5px; color: var(--gold); font-weight: 700; }
      .poster .pr span { color: var(--muted); font-weight: 400; }

      /* fun */
      .fun-card .fb { font-size: 15px; line-height: 1.75; overflow-wrap: anywhere; }
      .fun-card .fl { font-size: 11.5px; letter-spacing: .12em; color: var(--muted); margin-bottom: 6px; }
      .luck-big { font-family: "Noto Serif SC", serif; font-size: 30px; font-weight: 900; color: var(--accent); }

      footer { border-top: 1px solid var(--line); margin-top: 44px; padding: 20px; text-align: center; color: var(--muted); font-size: 12.5px; line-height: 1.8; }
      footer .wrap { max-width: 1180px; margin: 0 auto; }
    </style>
  </head>
  <body>
    <!-- Fixed toolbar: page search + section quick jumps. Permanent feature — keep when updating daily data. -->
    <div class="toolbar">
      <div class="toolbar-inner">
        <div class="search-row">
          <label class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.8-3.8"></path></svg>
            <input id="pageSearch" type="search" placeholder="搜索全页条目：输入标题或摘要关键词" aria-label="搜索全页条目" autocomplete="off" />
          </label>
          <button type="button" class="search-clear" id="searchClear" hidden>清空</button>
          <span class="search-status" id="searchStatus" role="status" aria-live="polite"></span>
        </div>
        <nav class="jump-nav" aria-label="版块快速跳转"><div class="toc-inner" id="tocInner"></div></nav>
      </div>

      /* ---------- 07 · trends (hand-authored SVG) ---------- */
      function lineChart(series, opts) {
        opts = opts || {};
        const W = 720, H = 240, PL = 40, PR = 52, PT = 20, PB = 30;
        const iw = W - PL - PR, ih = H - PT - PB;
        const vals = [];
        series.forEach(s => s.pts.forEach(p => { if (p.v != null) vals.push(p.v); }));
        let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
        if (opts.zero) min = Math.min(0, min);
        if (max === min) { max += 1; min -= 1; }
        const pad = (max - min) * 0.15; max += pad; min -= pad;
        const n = series[0].pts.length;
        const X = i => PL + (n === 1 ? iw / 2 : (iw * i) / (n - 1));
        const Y = v => PT + ih - ((v - min) / (max - min)) * ih;
        let g = "";
        for (let i = 0; i <= 3; i++) {
          const v = min + ((max - min) * i) / 3, y = Y(v);
          g += '<line x1="' + PL + '" y1="' + y + '" x2="' + (W - PR) + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>' +
               '<text x="' + (PL - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + (opts.fmt ? opts.fmt(v) : Math.round(v)) + "</text>";
        }
        series[0].pts.forEach((p, i) => {
          g += '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11.5" fill="var(--muted)">' + esc(p.label) + "</text>";
        });
        series.forEach(s => {
          const pts = s.pts.map((p, i) => X(i).toFixed(1) + "," + Y(p.v).toFixed(1)).join(" ");
          g += '<polyline points="' + pts + '" fill="none" stroke="' + s.color + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
          s.pts.forEach((p, i) => {
            g += '<circle cx="' + X(i) + '" cy="' + Y(p.v) + '" r="3.6" fill="var(--surface)" stroke="' + s.color + '" stroke-width="2.2"/>';
          });
          const lp = s.pts[s.pts.length - 1];
          g += '<text x="' + (X(s.pts.length - 1) + 8) + '" y="' + (Y(lp.v) + 4) + '" font-size="12" font-weight="700" fill="' + s.color + '">' + (opts.fmt ? opts.fmt(lp.v) : lp.v) + "</text>";
        });
        return '<svg viewBox="0 0 ' + W + " " + H + '" role="img">' + g + "</svg>";
      }

          '<span class="li"><span class="sw" style="background:' + dimColors[k] + '"></span>' + name + " " + T[T.length - 1][k] + "</span>").join("") + "</div>";
        const metrics = [
          ["usdRate", "美元汇率", "1 美元折人民币", v => "¥" + (1 / v).toFixed(3), v => (1 / v).toFixed(3), true],

            '<div><span class="mv">' + fmt(last) + '</span> <span class="delta ' + cls + '">' + arrow + " 较 " + T[0].date.slice(5).replace("-", "/") + "</span></div>" +
            '<div class="chart-wrap">' + chart + "</div></div>";
        }).join("");
        body("trends").innerHTML =
          '<div class="card"><h3>五维影响强度走势<span class="tag">0–100 分</span></h3><div class="chart-wrap">' + main + "</div>" + legend + "</div>" +

          $("#dbTabs").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
          renderDB(Number(b.dataset.i));
        });
      })();

          funCard("疯狂星期四", esc(f.kfc)) +
          funCard("段子", esc(f.duanzi)) +
          funCard("冷笑话", esc(f.joke)) +
          funCard("今日答案", '<span class="luck-big">' + esc(f.answer.answer) + "</span><br>" + esc(f.answer.answer_en)) +
          funCard("今日运程", '<span class="luck-big">' + esc(f.luck.luck_desc) + "</span><br>" + esc(f.luck.luck_tip)) +
          funCard("发病文学", esc(f.fabing)) +
          "</div>";
        $("#footText").innerHTML =
          "每日资讯早报 — 每日更新的静态快照，本页数据日期为 " + D.digestDate + "，内容为构建时抓取的定格版本。<br>" +
          "数据来源：60s API（公开资讯聚合） · 壁纸来自必应每日一图 · 本页不含任何个人隐私信息";

    </script>
    <script>
      /* ---------- fixed toolbar: section jumps + live search (permanent feature) ---------- */
      (function () {
        /* Quick-jump bar: labels and order as specified; targets are the existing section ids. */
        var JUMPS = [
          ["analysis", "影响分析"],
          ["trends", "趋势"],
          ["s60", "每天60秒读懂世界"],
          ["tech", "科技资讯"],
          ["finance", "财经行情"],
          ["hot", "全网热榜"],
          ["weather", "天气与历法"],
          ["ent", "文娱"],
          ["fun", "每日一乐"]
        ];
        var tocEl = document.getElementById("tocInner");
        tocEl.innerHTML = "";
        JUMPS.forEach(function (pair) {
          var a = document.createElement("a");
          a.href = "#" + pair[0];
          a.textContent = pair[1];
          a.addEventListener("click", function (e) {
            var target = document.getElementById(pair[0]);
            if (!target) return;
            e.preventDefault();
            var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            target.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
          });
          tocEl.appendChild(a);
        });

        var input = document.getElementById("pageSearch");
        var clearBtn = document.getElementById("searchClear");
        var status = document.getElementById("searchStatus");
        var emptyEl = document.getElementById("searchEmpty");
        var app = document.getElementById("app");

        /* Entry-level elements across every section: titles + summaries live in their text. */
        var ITEM_SEL = ".news60 p, .art, .rank-list li, .epic-card, .poster, .hist-item, .fc-row, .kv, .life-item, .fx-tile, .fuel-tile, .cd-tile, .prog, tbody tr, .fun-card, .ana-summary, #analysis .card, #trends .card, .wx-now";
        var SCOPED_SEL = ITEM_SEL.split(",").map(function (s) { return "#app " + s.trim(); }).join(", ");

        function collectItems() {
          var set = new Set();
          document.querySelectorAll(SCOPED_SEL).forEach(function (el) { set.add(el); });
          /* Cards with no entry-level children (e.g. 摸鱼日历, 趋势图卡) are entries themselves. */
          document.querySelectorAll("#app .card").forEach(function (card) {
            var hasChild = false;
            set.forEach(function (el) { if (el !== card && card.contains(el)) hasChild = true; });
            if (!hasChild) set.add(card);
          });
          return Array.from(set);
        }

        function applyFilter() {
          var q = input.value.trim().toLowerCase();
          document.querySelectorAll(".search-hidden").forEach(function (el) { el.classList.remove("search-hidden"); });
          clearBtn.hidden = !q;
          if (!q) {
            status.textContent = "";
            emptyEl.hidden = true;
            return;
          }
          var items = collectItems();
          var count = 0;
          items.forEach(function (el) {
            if (el.textContent.toLowerCase().indexOf(q) !== -1) count++;
            else el.classList.add("search-hidden");
          });
          /* Cards whose entries are all filtered out disappear too — unless the card's own heading matches. */
          document.querySelectorAll("#app .card").forEach(function (card) {
            if (card.classList.contains("search-hidden")) return;
            var desc = items.filter(function (el) { return el !== card && card.contains(el); });
            if (!desc.length) return;
            var anyVisible = desc.some(function (el) { return !el.classList.contains("search-hidden"); });
            if (anyVisible) return;
            var h3 = card.querySelector("h3");
            if (h3 && h3.textContent.toLowerCase().indexOf(q) !== -1) {
              desc.forEach(function (el) { el.classList.remove("search-hidden"); });
              count++;
            } else {
              card.classList.add("search-hidden");
            }
          });
          /* Grid wrappers left with no visible children collapse. */
          document.querySelectorAll("#app .grid, #app .epic-grid, #app .poster-grid, #app .fx-grid, #app .fuel-grid, #app .mini-grid, #app .life-grid").forEach(function (wrap) {
            var kids = Array.prototype.slice.call(wrap.children);
            if (kids.length && kids.every(function (k) { return k.classList.contains("search-hidden"); })) {
              wrap.classList.add("search-hidden");
            }
          });
          /* Sections with no surviving entries are hidden entirely. */
          document.querySelectorAll("#app section").forEach(function (sec) {
            var anyVisible = items.some(function (el) { return sec.contains(el) && !el.classList.contains("search-hidden"); });
            if (!anyVisible) sec.classList.add("search-hidden");
          });
          status.innerHTML = count > 0 ? "找到 <b>" + count + "</b> 条匹配" : "未找到匹配条目";
          emptyEl.hidden = count !== 0;
        }

        input.addEventListener("input", applyFilter);
        input.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && input.value) { input.value = ""; applyFilter(); }
        });
        clearBtn.addEventListener("click", function () {
          input.value = "";
          applyFilter();
          input.focus();
        });
        /* Tab switches (Hacker News / 豆瓣) re-render lists — re-apply the active filter. */
        new MutationObserver(function () {
          if (input.value.trim()) applyFilter();
        }).observe(app, { childList: true, subtree: true });
      })();
    </script>
  </body>
